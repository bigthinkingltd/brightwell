apiVersion: v1
kind: Namespace
metadata:
  name: brightwell
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: www
  namespace: brightwell
spec:
  replicas: 1
  selector:
    matchLabels:
      app: www
  template:
    metadata:
      labels:
        app: www
    spec:
      containers:
        - name: brightwell
          image: ghcr.io/pcaldredbann/brightwell:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          env:
            - name: NODE_ENV
              value: "production"
            - name: PORT
              value: "3000"
            - name: HOSTNAME
              value: "0.0.0.0"
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: www-svc
  namespace: brightwell
spec:
  selector:
    app: www
  ports:
    - name: http
      port: 80
      targetPort: 3000
  type: ClusterIP
